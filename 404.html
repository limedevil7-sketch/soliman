<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | You've Entered the Wrong Nightmare</title>
  <link rel="icon" href="../images/logo.jfif" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500&family=Noto+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .error-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(196,30,58,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 15vw, 9rem);
      color: var(--crimson);
      text-shadow: 0 0 40px var(--crimson-glow);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    .error-sub {
      color: var(--muted);
      margin-bottom: 2.5rem;
      font-family: var(--font-arabic);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-glow"></div>
    <div style="position:relative;z-index:2;">
      <div class="error-code">404</div>
      <h1 class="error-title">YOU'VE ENTERED THE WRONG NIGHTMARE</h1>
      <p class="error-sub">هذه الصفحة غير موجودة... أو ربما اختفت.</p>
      <a href="../index.html" class="btn btn-primary btn-lg">RETURN TO SAFETY</a>
    </div>
  </div>
</body>
</html>
