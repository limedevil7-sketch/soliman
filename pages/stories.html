<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories / Nightmares | Soliman Nightmares</title>
  <meta name="description" content="قصص الرعب، الغموض، والتكنولوجيا المظلمة من عالم Soliman Nightmares">
  <link rel="icon" href="/images/logo.jfif" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .stories-page { padding-top: calc(var(--nav-height) + 2rem); min-height: 100vh; }
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: center;
      justify-content: center;
    }
    .search-input {
      background: var(--charcoal);
      border: 1px solid var(--border-gray);
      border-radius: var(--radius-sm);
      padding: 0.65rem 1rem;
      color: var(--off-white);
      font-family: var(--font-arabic);
      font-size: 0.9rem;
      min-width: 220px;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--crimson);
    }
    .filter-btn {
      padding: 0.5rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--border-gray);
      border-radius: var(--radius-sm);
      color: var(--muted);
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--crimson);
      color: var(--crimson);
      background: var(--crimson-soft);
    }
    .stories-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .stories-list { grid-template-columns: repeat(2, 1fr); }
    }
    .story-item {
      background: var(--charcoal);
      border: 1px solid var(--border-gray);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s;
      display: flex;
      flex-direction: column;
    }
    .story-item:hover {
      border-color: rgba(196,30,58,0.35);
      transform: translateY(-3px);
    }
    .story-item-img {
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
    }
    .story-item-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .story-item-cat {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--crimson);
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
    }
    .story-item-title {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      font-family: var(--font-arabic);
    }
    .story-item-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
      flex: 1;
      font-family: var(--font-arabic);
    }
    .story-item-meta {
      font-size: 0.75rem;
      color: var(--dim);
      display: flex;
      gap: 1rem;
    }
    .no-results {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-family: var(--font-arabic);
    }
  </style>
</head>
<body>
  <div id="easter-overlay" class="easter-overlay" aria-hidden="true"></div>
  <div id="easter-message" class="easter-message" role="status" aria-live="polite"></div>

  <nav id="navbar" class="navbar scrolled">
    <div class="nav-container">
      <a href="/" class="nav-logo" id="logo-trigger">
        <img src="/images/logo.jfif" alt="Soliman Nightmares" class="logo-img" width="48" height="48">
        <span class="logo-text">SOLIMAN NIGHTMARES</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="nav-links">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/pages/nightmares.html" class="nav-link">Nightmares</a></li>
        <li><a href="/pages/dark-tech.html" class="nav-link">Dark Tech</a></li>
        <li><a href="/pages/stories.html" class="nav-link active">Stories</a></li>
        <li><a href="/pages/messages.html" class="nav-link">Messages</a></li>
        <li><a href="/pages/about.html" class="nav-link">About</a></li>
        <li><a href="https://youtube.com/@solimannightmares?si=w_bGt-2Zk-AxQQC4" class="nav-link" target="_blank" rel="noopener">YouTube</a></li>
      </ul>
      <a href="https://youtube.com/@solimannightmares?si=w_bGt-2Zk-AxQQC4" class="btn btn-primary nav-cta" target="_blank" rel="noopener">WATCH ON YOUTUBE</a>
    </div>
  </nav>

  <main class="stories-page">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">NIGHTMARES ARCHIVE</span>
        <h1 class="section-title">Stories</h1>
        <p class="section-desc">كل القصص التي خرجت من الظلام</p>
      </div>

      <div class="filters-bar">
        <input type="search" class="search-input" id="search-input" placeholder="ابحث في القصص..." aria-label="بحث">
        <button class="filter-btn active" data-cat="all">ALL</button>
        <button class="filter-btn" data-cat="horror">HORROR</button>
        <button class="filter-btn" data-cat="mystery">MYSTERY</button>
        <button class="filter-btn" data-cat="dark-tech">DARK TECH</button>
        <button class="filter-btn" data-cat="dark-web">DARK WEB</button>
        <button class="filter-btn" data-cat="future">FUTURE</button>
      </div>

      <div class="stories-list" id="stories-list"></div>
      <div class="no-results" id="no-results" hidden>لا توجد قصص مطابقة.</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <p>&copy; 2026 Soliman Nightmares.</p>
        <a href="/">Home</a>
      </div>
    </div>
  </footer>

  <script src="/js/data.js"></script>
  <script src="/js/easter-egg.js"></script>
  <script>
    (function () {
      const list = document.getElementById('stories-list');
      const noResults = document.getElementById('no-results');
      const searchInput = document.getElementById('search-input');
      const filterBtns = document.querySelectorAll('.filter-btn');
      let currentCat = 'all';
      let currentQuery = '';

      // Read URL params
      const params = new URLSearchParams(window.location.search);
      if (params.get('cat')) {
        currentCat = params.get('cat');
        filterBtns.forEach(b => {
          b.classList.toggle('active', b.dataset.cat === currentCat || (currentCat === 'all' && b.dataset.cat === 'all'));
        });
      }

      function render() {
        if (typeof STORIES === 'undefined') return;
        let filtered = STORIES.slice();

        if (currentCat !== 'all') {
          filtered = filtered.filter(s => s.category === currentCat);
        }
        if (currentQuery) {
          const q = currentQuery.toLowerCase();
          filtered = filtered.filter(s =>
            s.title.toLowerCase().includes(q) ||
            s.description.toLowerCase().includes(q) ||
            (s.content && s.content.toLowerCase().includes(q))
          );
        }

        if (filtered.length === 0) {
          list.innerHTML = '';
          noResults.hidden = false;
          return;
        }
        noResults.hidden = true;

        list.innerHTML = filtered.map(s => `
          <article class="story-item">
            <div class="story-item-img" style="background-image:url('${s.image}')"></div>
            <div class="story-item-body">
              <div class="story-item-cat">${s.category.toUpperCase()}</div>
              <h2 class="story-item-title">${s.title}</h2>
              <p class="story-item-desc">${s.description}</p>
              <div class="story-item-meta">
                <span>${s.readingTime} min read</span>
                <span>${s.date}</span>
              </div>
            </div>
          </article>
        `).join('');
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCat = btn.dataset.cat;
          render();
        });
      });

      let searchTimeout;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          currentQuery = searchInput.value.trim();
          render();
        }, 200);
      });

      // Nav mobile
      const navToggle = document.getElementById('nav-toggle');
      const navLinks = document.getElementById('nav-links');
      if (navToggle) {
        navToggle.addEventListener('click', () => {
          const open = navToggle.getAttribute('aria-expanded') === 'true';
          navToggle.setAttribute('aria-expanded', String(!open));
          navLinks.classList.toggle('open', !open);
        });
      }

      render();
    })();
  </script>
</body>
</html>
