<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Tech | Soliman Nightmares</title>
  <link rel="icon" href="images/logo.jfif" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #050505;
      --bg-card: #0c0c0c;
      --bg-hover: #141414;
      --border-color: #222222;
      --accent-red: #c91818;
      --accent-glow: rgba(201, 24, 24, 0.3);
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --text-dim: #555555;
      --font-heading: 'Cinzel', 'Noto Sans Arabic', serif;
      --font-body: 'Inter', 'Noto Sans Arabic', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow-x: hidden;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(5, 5, 5, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
    }
    .nav-container {
      max-width: 1300px; margin: 0 auto; padding: 0.8rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
    }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo-img { border-radius: 4px; object-fit: cover; }
    .logo-text { font-family: var(--font-heading); font-weight: 700; letter-spacing: 2px; font-size: 1rem; color: #fff; }
    
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .nav-link { color: var(--text-muted); font-size: 0.85rem; transition: var(--transition); }
    .nav-link:hover, .nav-link.active { color: var(--accent-red); }

    .nav-socials {
      display: flex; gap: 0.75rem; align-items: center; margin-left: 10px; padding-left: 15px; border-left: 1px solid var(--border-color);
    }
    .social-icon-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 4px;
      color: var(--text-muted); font-size: 0.8rem; transition: var(--transition);
    }
    .social-icon-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.6rem 1.2rem; font-weight: 600; font-size: 0.8rem; letter-spacing: 1px;
      border-radius: 4px; transition: var(--transition); cursor: pointer;
    }
    .btn-primary { background: var(--accent-red); color: #fff; border: 1px solid var(--accent-red); }
    .btn-primary:hover { background: #a51212; box-shadow: 0 0 15px var(--accent-glow); }

    /* Page Header */
    .page-header {
      padding: 10rem 2rem 4rem; text-align: center; background: radial-gradient(circle at center, #1a0505 0%, var(--bg-deep) 70%);
      border-bottom: 1px solid var(--border-color);
    }
    .page-title { font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 1rem; color: #fff; }
    .page-desc { color: var(--text-muted); max-width: 600px; margin: 0 auto; }

    /* Content Container & Grid */
    .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1rem; }
    
    .tech-grid {
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 1.5rem;
    }
    .tech-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; transition: var(--transition);
      display: flex; flex-direction: column; height: 100%;
    }
    .tech-card:hover { border-color: var(--accent-red); transform: translateY(-5px); }
    .tech-img { height: 180px; background-size: cover; background-position: center; filter: grayscale(10%); width: 100%; }
    .tech-body { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
    .tech-title { font-family: var(--font-heading); font-size: 1.15rem; margin-bottom: 0.75rem; color: #fff; }
    .tech-text { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; flex-grow: 1; }

    /* Footer */
    .footer { background: var(--bg-card); border-top: 1px solid var(--border-color); padding: 2.5rem 1rem; text-align: center; color: var(--text-dim); font-size: 0.85rem; }
    .footer strong { color: var(--accent-red); }

    /* تحسينات الموبايل */
    @media (max-width: 768px) {
      .nav-container { padding: 0.8rem 1rem; justify-content: center; }
      .nav-links { justify-content: center; gap: 1rem; font-size: 0.8rem; }
      .page-header { padding: 8rem 1rem 2.5rem; }
      .page-title { font-size: 2rem; }
      .container { padding: 2rem 1rem; }
      .tech-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.jfif" alt="Logo" class="logo-img" width="40" height="40">
        <span class="logo-text">SOLIMAN NIGHTMARES</span>
      </a>
      
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="nightmares.html" class="nav-link">Nightmares</a></li>
        <li><a href="dark-tech.html" class="nav-link active">Dark Tech</a></li>
        <li><a href="stories.html" class="nav-link">Stories</a></li>
        <li><a href="messages.html" class="nav-link">Messages</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>

      <div class="nav-socials">
        <a href="https://youtube.com/@solimannightmares?si=w_bGt-2Zk-AxQQC4" class="social-icon-btn" target="_blank" title="YouTube">YT</a>
        <a href="https://t.me/+Di-kNOxDldE0OTk0" class="social-icon-btn" target="_blank" title="Telegram">TG</a>
        <a href="https://discord.gg/bXbSysEwa" class="social-icon-btn" target="_blank" title="Discord">DC</a>
        <a href="https://www.facebook.com/share/1ZWHfsjDSw/?mibextid=wwXIfr" class="social-icon-btn" target="_blank" title="Facebook">FB</a>
      </div>
      
      <a href="https://youtube.com/@solimannightmares?si=w_bGt-2Zk-AxQQC4" class="btn btn-primary" target="_blank">SUBSCRIBE</a>
    </div>
  </nav>

  <main>
    <header class="page-header">
      <h1 class="page-title">// DARK TECH</h1>
      <p class="page-desc">التقنيات المظلمة، خبايا البرمجيات، وأسرار التكنولوجيا التي لا يخبرك بها أحد.</p>
    </header>

    <div class="container">
      <div class="tech-grid" id="techGrid">
        <!-- سيتم توليد كروت التقنية المظلمة تلقائياً بالصور الحقيقية -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Soliman Nightmares. All rights reserved. | Crafted by <strong>Lime_devil</strong></p>
  </footer>

  <script>
    const techVideos = [
      {
        url: "https://youtu.be/3sNfGOSQxwo?si=-gzsHzkVdXhnNiuf",
        title: "خبايا وأسرار التقنية المظلمة",
        desc: "كيف يتم استغلال الثغرات الرقمية في أبسط الأنظمة للتجسس وخداع المستخدمين."
      },
      {
        url: "https://youtu.be/iHJavBQP9u8?si=szqL79gh7oZtXJSq",
        title: "البرمجيات الخفية والأكواد المرعبة",
        desc: "رحلة داخل الأعماق البرمجية وكيف تعمل الخوارزميات الخفية في السيطرة على البيانات."
      },
      {
        url: "https://youtu.be/iYGZUZJM6JE?si=P_j1y9ZXDekByvpM",
        title: "كواليس الأمن السيبراني المظلم",
        desc: "أسرار خطيرة عن الاختراق والأنظمة الأمنية التي تدار خلف الكواليس."
      },
      {
        url: "https://youtu.be/DdV7MTh7zT4?si=BPF1-",
        title: "الذكاء الاصطناعي والتحكم الرقمي",
        desc: "دراسة تحليلية لطرق توجيه التقنيات الحديثة لبرمجة سلوك الأفراد دون أن يشعروا."
      },
      {
        url: "https://youtu.be/NCmyHDw8u30?si=145ytp4djBumPnVtm5Ivi_FPPqg",
        title: "ملفات الشبكات المخفية",
        desc: "كيف تعمل بروتوكولات التخفي والأنفاق الرقمية المعقدة في أعماق الشبكة."
      },
      {
        url: "https://youtu.be/qWQX0hGmj9Y?si=jyntnf3yYGMnyGYu",
        title: "نهاية العالم الرقمي",
        desc: "أخطر التهديدات التكنولوجية التي يخشى الخبراء الحديث عنها علناً."
      }
    ];

    function getYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    const grid = document.getElementById('techGrid');

    techVideos.forEach(video => {
      const videoId = getYouTubeId(video.url);
      const thumbUrl = videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=800&q=80';

      const card = document.createElement('div');
      card.className = 'tech-card';
      card.innerHTML = `
        <div class="tech-img" style="background-image: url('${thumbUrl}')"></div>
        <div class="tech-body">
          <h3 class="tech-title">${video.title}</h3>
          <p class="tech-text">${video.desc}</p>
          <a href="${video.url}" class="btn btn-primary" target="_blank">استكشاف الملف</a>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
